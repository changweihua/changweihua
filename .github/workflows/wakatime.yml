name: WakaTime Readme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: waka-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKAPI_BASE_URL: ${{ secrets.WAKAPI_BASE_URL }}
        run: |
          echo "GH_TOKEN 长度: ${#GH_TOKEN}"
          echo "WAKATIME_API_KEY 长度: ${#WAKATIME_API_KEY}"
          echo "WAKAPI_BASE_URL: $WAKAPI_BASE_URL"
          [ -z "$GH_TOKEN" ] && echo "❌ GH_TOKEN 为空"
          [ -z "$WAKATIME_API_KEY" ] && echo "❌ WAKATIME_API_KEY 为空"
          [ -z "$WAKAPI_BASE_URL" ] && echo "❌ WAKAPI_BASE_URL 为空"

      - uses: athul/waka-readme@master   # ← 建议后续固定到具体提交 SHA
        with:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}            # 显式提供，避免默认 token 权限不足
          REPOSITORY: ${{ github.repository }}          # 显式指定仓库
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL: ${{ secrets.WAKAPI_BASE_URL }}  # Wakapi 需为 https://你的域名/api
          COMMIT_MESSAGE: Update Waka Stats
          BLOCKS: "⬜🟨🟩"
          TIME_RANGE: last_30_days
          SHOW_TIME: true
          SECTION_NAME: wakao
